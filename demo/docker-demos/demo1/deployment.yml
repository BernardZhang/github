apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: k8s-demo1
  name: k8s-demo1-deployment
spec:
  progressDeadlineSeconds: 2147483647
  replicas: 10
  minReadySeconds: 10
  revisionHistoryLimit: 2147483647
  selector:
    matchLabels:
      app: k8s-demo1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: k8s-demo1
    spec:
      containers:
      - image: k8s-demo1:0.3
        imagePullPolicy: IfNotPresent
        name: k8s-demo1-pod
        ports:
        - containerPort: 80
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
status: {}
